<svg width="100%" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d13"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#bg)"/>

  <text x="450" y="112" text-anchor="middle"
        font-family="SFMono-Regular, Consolas, monospace" font-size="13"
        letter-spacing="4" fill="#7d8590" opacity="0">
    B.TECH CSE (AI/ML) &#183; IARE, HYDERABAD
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.1s" fill="freeze"/>
  </text>

  <text x="450" y="190" text-anchor="middle"
        font-family="Helvetica Neue, Arial, sans-serif" font-weight="700"
        font-size="54" letter-spacing="0.5" fill="#f0f3f6" opacity="0">
    Hi, I'm <tspan fill="#58a6ff">Suhaas</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.4s" fill="freeze"/>
  </text>

  <line x1="450" y1="218" x2="450" y2="218" stroke="#58a6ff" stroke-width="2">
    <animate attributeName="x1" from="450" to="385" dur="0.5s" begin="1.1s" fill="freeze"/>
    <animate attributeName="x2" from="450" to="515" dur="0.5s" begin="1.1s" fill="freeze"/>
  </line>
</svg>
